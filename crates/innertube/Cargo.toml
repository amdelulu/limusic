[package]
name = "innertube"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
tokio = { workspace = true, features = ["time", "sync"] }
sha1 = "0.10"
hex = "0.4"
urlencoding = "2"
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[features]
# Opt-in live-YouTube smoke tests — NOT in the default `cargo test` run.
integration-tests = []

# iOS: rustypipe runs the player's JS through rquickjs, whose -sys crate ships pregenerated bindings
# for desktop, Linux and wasm targets only. On aarch64-apple-ios it fails to compile with
# "couldn't find file bindings/aarch64-apple-ios.rs" and tells you to use the `bindgen` feature.
# Enabling the feature here (cargo unifies it into rustypipe's copy) generates them at build time;
# nothing changes on the desktop targets.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs-sys = { version = "0.9", features = ["bindgen"] }
